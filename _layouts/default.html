<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <!-- FAVICON GALA BIENES RAÍCES -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/gala-bienes-raices-icono.png' | relative_url }}">
  <link rel="shortcut icon" type="image/png" href="{{ '/assets/images/gala-bienes-raices-icono.png' | relative_url }}">
</head>
<body>
  <header class="page-header" role="banner">
    <div class="header-container">
      <!-- LOGO A LA IZQUIERDA -->
      <a href="{{ '/' | relative_url }}" class="header-logo-link">
        <img src="{{ '/assets/images/gala-bienes-raices-logo-1.png' | relative_url }}" alt="Gala Bienes Raíces" class="gala-header-logo">
      </a>

      <!-- BURGER CENTRADO HORIZONTALMENTE -->
      <div class="burger-wrapper">
        <input type="checkbox" id="burger-toggle">
        <label for="burger-toggle" class="burger-icon" aria-label="Menú">
          <span></span>
          <span></span>
          <span></span>
        </label>
        <nav class="burger-nav">
          <a href="/quienes-somos/">¿Quiénes Somos?</a>
          <a href="/catalogo-habitacional/">Propiedades Habitacionales</a>
          <a href="/catalogo-comercial/">Propiedades Comerciales</a>
        </nav>
      </div>

      <!-- ESPACIO FANTASMA PARA BALANCIAR EL FLEXBOX -->
      <div class="header-spacer"></div>
    </div>
  </header>

  <main id="content" class="main-content" role="main">
    {{ content }}
  </main>
</body>
</html>
