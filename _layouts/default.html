
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  
  <!-- FAVICON GALA BIENES RAÍCES -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/gala-bienes-raices-icono.png' | relative_url }}">
  <link rel="shortcut icon" type="image/png" href="{{ '/assets/images/gala-bienes-raices-icono.png' | relative_url }}">

  <style>
    /* 1. MATAR EL ENCABEZADO Y ESPACIOS DEL TEMA CAYMAN DE RAÍZ */
    header.page-header,
    .page-header {
      background: #1a1a1a !important;
      padding: 10px 15px !important;
      min-height: 0 !important;
      height: auto !important;
      margin: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* Ocultar el título H1, subtítulos o links inyectados por Cayman */
    .page-header h1,
    .page-header h2,
    .page-header .project-name,
    .page-header .project-tagline,
    .page-header .btn {
      display: none !important;
    }

    /* 2. UN SOLO LOGO COMPACTO (42px) */
    .gala-header-logo {
      max-height: 42px !important;
      width: auto !important;
      display: block !important;
      margin: 0 auto !important;
    }

    /* 3. MENÚ BURGER EN SU LUGAR */
    .burger-wrapper {
      position: relative !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      margin-top: 4px !important;
    }

    #burger-toggle {
      display: none !important;
    }

    .burger-icon {
      cursor: pointer !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      width: 24px !important;
      height: 16px !important;
      z-index: 100 !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .burger-icon span {
      display: block !important;
      height: 2px !important;
      width: 100% !important;
      background-color: #ffffff !important;
      border-radius: 2px !important;
      transition: all 0.3s ease !important;
    }

    #burger-toggle:checked + .burger-icon span:nth-child(1) {
      transform: translateY(7px) rotate(45deg) !important;
    }
    #burger-toggle:checked + .burger-icon span:nth-child(2) {
      opacity: 0 !important;
    }
    #burger-toggle:checked + .burger-icon span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg) !important;
    }

    .burger-nav {
      position: absolute !important;
      top: 25px !important;
      left: 50% !important;
      transform: translateX(-50%) translateY(-10px) !important;
      background: rgba(26, 26, 26, 0.98) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 12px !important;
      padding: 10px 0 !important;
      width: 200px !important;
      display: flex !important;
      flex-direction: column !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
      opacity: 0 !important;
      visibility: hidden !important;
      transition: all 0.3s ease !important;
      z-index: 99 !important;
    }

    #burger-toggle:checked ~ .burger-nav {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translateX(-50%) translateY(0) !important;
    }

    .burger-nav a {
      color: #ffffff !important;
      text-decoration: none !important;
      padding: 8px 16px !important;
      font-size: 0.9rem !important;
      text-align: center !important;
      transition: background 0.2s ease !important;
      font-family: 'Josefin Sans', sans-serif !important;
    }

    .burger-nav a:hover {
      background: rgba(255, 255, 255, 0.1) !important;
    }
  </style>
</head>
<body>
  <header class="page-header" role="banner">
    
    <!-- LOGO ÚNICO EN EL HEADER -->
    <a href="{{ '/' | relative_url }}" style="text-decoration: none; display: block;">
      <img src="{{ '/assets/images/gala-bienes-raices-logo.png' | relative_url }}" alt="Gala Bienes Raíces" class="gala-header-logo">
    </a>

    <!-- MENÚ BURGER -->
    <div class="burger-wrapper">
      <input type="checkbox" id="burger-toggle">
      <label for="burger-toggle" class="burger-icon" aria-label="Menú">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <nav class="burger-nav">
        <a href="/quienes-somos/">¿Quiénes Somos?</a>
        <a href="/catalogo-habitacional/">Propiedades Habitacionales</a>
        <a href="/catalogo-comercial/">Propiedades Comerciales</a>
      </nav>
    </div>

  </header>

  <main id="content" class="main-content" role="main">
    {{ content }}
  </main>
</body>
</html>
