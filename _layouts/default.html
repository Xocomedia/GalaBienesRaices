<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  
  <!-- FAVICON GALA BIENES RAÍCES (Sin tilde para evitar errores en servidores web) -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/gala-bienes-raices-icono.png' | relative_url }}">
  <link rel="shortcut icon" type="image/png" href="{{ '/assets/images/gala-bienes-raices-icono.png' | relative_url }}">

  <style>
    /* Reducción de la franja negra del encabezado */
    .page-header {
      padding: 12px 20px !important; /* Disminuye el relleno arriba/abajo */
      min-height: auto !important;
    }

    /* Reducción del tamaño del logo en el encabezado */
    .page-header img,
    .project-name img,
    .logo-container img {
      max-height: 65px !important; /* Ajusta la altura del logo (prueba entre 55px y 70px) */
      width: auto !important;
      display: block;
      margin: 0 auto;
    }

    /* Ajuste de margen para el menú hamburguesa */
    .burger-wrapper {
      margin-top: 6px !important;
    }
  </style>
</head>
<body>
  <header class="page-header" role="banner">
    
    <!-- Menú Hamburguesa directo debajo del logo -->
    <div class="burger-wrapper">
      <input type="checkbox" id="burger-toggle">
      <label for="burger-toggle" class="burger-icon" aria-label="Menú">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <nav class="burger-nav">
        <a href="#nosotros">¿Quiénes Somos?</a>
        <a href="#servicios">Servicios</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </div>

  </header>

  <main id="content" class="main-content" role="main">
    {{ content }}
  </main>
</body>
</html>
