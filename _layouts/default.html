<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  
  <!-- FAVICON GALA BIENES RAÍCES -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/gala-bienes-raices-icono.png' | relative_url }}">
  <link rel="shortcut icon" type="image/png" href="{{ '/assets/images/gala-bienes-raices-icono.png' | relative_url }}">

  <style>
    /* 1. OCULTAR EL LOGO Y TITULOS GIGANTES DEL TEMA CAYMAN */
    header.page-header,
    .page-header {
      background: #1a1a1a !important; /* Quita el fondo/gradiente por defecto */
      padding: 12px 15px !important;   /* Reduce la franja negra al mínimo */
      min-height: 0 !important;
      height: auto !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      position: relative !important;
    }

    /* Esconde el título y subtítulo automático de Cayman */
    .page-header .project-name, 
    .page-header .project-tagline,
    .project-name, 
    .project-tagline {
      display: none !important;
    }

    /* 2. UN SOLO LOGO COMPACTO Y ELEGANTE */
    .gala-header-logo {
      max-height: 48px !important;
      width: auto !important;
      display: block !important;
      margin: 0 auto 4px auto !important;
    }

    /* 3. MENÚ BURGER PEGADO AL LOGO */
    .burger-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 4px !important;
      padding: 0 !important;
    }

    #burger-toggle {
      display: none;
    }

    .burger-icon {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 24px;
      height: 16px;
      z-index: 100;
      padding: 0;
      margin: 0;
    }

    .burger-icon span {
      display: block;
      height: 2px;
      width: 100%;
      background-color: #ffffff;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* Animación a X al dar clic */
    #burger-toggle:checked + .burger-icon span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    #burger-toggle:checked + .burger-icon span:nth-child(2) {
      opacity: 0;
    }
    #burger-toggle:checked + .burger-icon span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Desplegable del menú */
    .burger-nav {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(26, 26, 26, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 0;
      width: 200px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 99;
    }

    #burger-toggle:checked ~ .burger-nav {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .burger-nav a {
      color: #ffffff !important;
      text-decoration: none !important;
      padding: 8px 16px;
      font-size: 0.9rem;
      text-align: center;
      transition: background 0.2s ease;
      font-family: 'Josefin Sans', sans-serif;
    }

    .burger-nav a:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff !important;
    }
  </style>
</head>
<body>
  <header class="page-header" role="banner">
    
    <!-- UN SOLO LOGO (48px de alto) -->
    <a href="{{ '/' | relative_url }}" style="text-decoration: none; display: block;">
      <img src="{{ '/assets/images/gala-bienes-raices-logo.png' | relative_url }}" alt="Gala Bienes Raíces" class="gala-header-logo">
    </a>

    <!-- MENÚ BURGER -->
    <div class="burger-wrapper">
      <input type="checkbox" id="burger-toggle">
      <label for="burger-toggle" class="burger-icon" aria-label="Menú">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <nav class="burger-nav">
        <a href="/quienes-somos/">¿Quiénes Somos?</a>
        <a href="/catalogo-habitacional/">Propiedades Habitacionales</a>
        <a href="/catalogo-comercial/">Propiedades Comerciales</a>
      </nav>
    </div>

  </header>

  <main id="content" class="main-content" role="main">
    {{ content }}
  </main>
</body>
</html>
