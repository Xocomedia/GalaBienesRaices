<style>
  .prop-page-wrapper {
    max-width: 1200px;
    margin: 30px auto 60px auto;
    padding: 0 20px;
    font-family: 'Bahnschrift', 'Segoe UI', sans-serif;
    color: #1f2937;
  }

  /* --- GALERÍA 70% CENTRADA --- */
  .gallery-container-70 {
    width: 70%;
    margin: 0 auto 35px auto;
    display: grid;
    grid-template-columns: 2.2fr 1fr;
    gap: 8px;
    height: 420px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }

  .main-photo-wrap {
    width: 100%;
    height: 100%;
    background: #f3f4f6;
  }

  .main-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .side-photos-wrap {
    display: grid;
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    height: 100%;
  }

  .side-photo-item {
    width: 100%;
    height: 100%;
    background: #f3f4f6;
    overflow: hidden;
  }

  .side-photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }

  .side-photo-item img:hover {
    transform: scale(1.05);
  }

  /* --- BLOQUE DE INFORMACIÓN INFERIOR CENTRADO (70%) --- */
  .info-container-70 {
    width: 70%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .header-block {
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 20px;
  }

  .state-tag {
    display: inline-block;
    background: #f3f4f6;
    color: #7f1d1d;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .prop-title {
    font-family: 'Josefin Sans', sans-serif !important;
    font-weight: 800;
    font-size: 2.2rem;
    color: #111827;
    line-height: 1.25;
    margin-bottom: 6px;
  }

  .prop-location {
    font-size: 1.05rem;
    color: #4b5563;
    margin-bottom: 12px;
  }

  .prop-price {
    font-family: 'Josefin Sans', sans-serif !important;
    font-size: 2rem;
    font-weight: 800;
    color: #7f1d1d;
  }

  /* BARRA DE CARACTERÍSTICAS HORIZONTAL */
  .features-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px 24px;
    font-size: 0.95rem;
    color: #374151;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }

  /* DESCRIPCIÓN DETALLADA (12pt) */
  .description-block {
    font-size: 12pt !important;
    line-height: 1.7;
    color: #374151;
    padding-top: 10px;
  }

  .description-block p {
    font-size: 12pt !important;
    margin-bottom: 14px;
  }
