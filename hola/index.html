<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola | Gala Bienes Raíces</title>

  <!-- Importación de Josefin Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Josefin Sans', sans-serif;
      font-optical-sizing: auto;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('/assets/images/Gala bienes raíces reforma.jpg') no-repeat center center fixed;
      background-size: cover;
      padding: 30px 20px;
    }

    /* Tarjeta principal */
    .card-container {
      background: rgba(100, 15, 20, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 48px;
      padding: 55px 45px;
      width: 100%;
      max-width: 580px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    /* Título principal */
    .card-title {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #ffffff;
      line-height: 1.2;
    }

    /* Botones base */
    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 16px 24px;
      border-radius: 30px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 1.25rem;
      transition: transform 0.2s ease, opacity 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .btn-link:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    /* Botones configurados en negro semi-transparente derivado de #1e1e1e */
    .btn-dark {
      background-color: rgba(30, 30, 30, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Botón de contacto se mantiene en rojo original */
    .btn-contacto {
      background-color: #7f1d1d;
      line-height: 1.25;
    }

    /* Enlace a sitio web */
    .site-domain {
      background: rgba(255, 255, 255, 0.92);
      color: #222222;
      padding: 10px 32px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      margin-top: 5px;
    }

    /* Iconos de redes sociales */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 5px;
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: transform 0.2s ease;
    }

    .social-icon:hover {
      transform: scale(1.15);
    }

    .social-icon svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    /* Logo de la empresa reemplazando texto */
    .logo-container {
      margin-top: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-container img {
      max-width: 170px;
      height: auto;
      display: block;
    }

    @media (max-width: 520px) {
      body {
        padding: 15px 12px;
      }

      .card-container {
        padding: 35px 22px;
        border-radius: 36px;
        gap: 16px;
      }

      .card-title {
        font-size: 1.7rem;
      }

      .btn-link {
        font-size: 1.05rem;
        min-height: 50px;
        padding: 12px 18px;
        border-radius: 24px;
      }

      .site-domain {
        font-size: 0.95rem;
        padding: 8px 24px;
      }

      .social-icon svg {
        width: 28px;
        height: 28px;
      }

      .logo-container img {
        max-width: 140px;
      }
    }
  </style>
</head>
<body>

  <main class="card-container">
    <h1 class="card-title">Aquí comienza tu hogar</h1>

    <a href="https://wa.me/TU_NUMERO_AQUI" class="btn-link btn-dark" target="_blank" rel="noopener">
      Escríbenos: WhatsApp
    </a>

    <a href="/catalogo-comercial" class="btn-link btn-dark">
      Catálogo comercial
    </a>

    <a href="/catalogo-habitacional" class="btn-link btn-dark">
      Catálogo habitacional
    </a>

    <a href="/contacto" class="btn-link btn-contacto">
      Deja tu contacto,<br>nosotros nos comunicamos
    </a>

    <a href="https://galabienesraices.com" class="site-domain">
      galabienesraices.com
    </a>

    <div class="social-links">

      <a href="https://facebook.com/TU_USUARIO" class="social-icon" target="_blank" rel="noopener" aria-label="Facebook">

        </svg>
      </a>
    </div>

    <!-- Reemplazo del texto final por la imagen del logo -->
    <div class="logo-container">
      <img src="/assets/images/gala-bienes-raices-logo.png" alt="Gala Bienes Raíces">
    </div>
  </main>

</body>
</html>
