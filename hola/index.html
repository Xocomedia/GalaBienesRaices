<head>

  <link rel="icon" type="image/png" href="/assets/images/gala-bienes-raices-ícono.png">

  <!-- Resto de tus fuentes y estilos... -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Josefin Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('/assets/images/Gala bienes raíces reforma.jpg') no-repeat center center fixed;
      background-size: cover;
      padding: 20px;
    }

    .card-container {
      background: rgba(100, 15, 20, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 44px;
      padding: 38px 36px 24px 36px;
      width: 100%;
      max-width: 520px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
    }

    .card-title {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 2px;
      color: #ffffff;
      line-height: 1.2;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 12px 20px;
      border-radius: 28px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.15rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.25);
      text-align: center;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .btn-link:hover {
      transform: translateY(-2px);
      opacity: 0.94;
    }

    .btn-white {
      background-color: rgba(255, 255, 255, 0.94);
      color: #1a1a1a;
    }

    .btn-contacto {
      background-color: #7f1d1d;
      color: #ffffff;
      line-height: 1.25;
    }

    /* Redes sociales */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 4px;
      margin-bottom: -4px;
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: transform 0.2s ease;
    }

    .social-icon:hover {
      transform: scale(1.15);
    }

    .social-icon svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* Bloque Marca + Dominio */
    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0;
    }

    .logo-container {
      display: inline-block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .logo-container:hover {
      transform: scale(1.04);
      opacity: 0.95;
    }

    .logo-container img {
      max-width: 145px;
      height: auto;
      display: block;
    }

    .site-domain-bubble {
      background: rgba(255, 255, 255, 0.94);
      color: #1a1a1a;
      padding: 5px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: -6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .site-domain-bubble:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    /* --- ESTILOS DEL MODAL --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: rgba(90, 12, 16, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 32px;
      padding: 32px 28px;
      width: 100%;
      max-width: 480px;
      color: #ffffff;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 22px;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .close-btn:hover {
      opacity: 1;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 18px;
      text-align: center;
      color: #ffffff;
    }

    .gbr-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f3f4f6;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.22);
    }
