<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola | Gala Bienes Raíces</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Sustituye la URL por la imagen de fondo de la CDMX */
      background: url('/assets/images/fondo-cdmx.jpg') no-repeat center center fixed;
      background-size: cover;
      padding: 20px;
    }

    /* Tarjeta principal traslúcida */
    .card-container {
      background: rgba(100, 15, 20, 0.75); /* Fondo guinda semi-transparente */
      backdrop-filter: blur(4px);            /* Efecto desenfoque si lo soporta el navegador */
      border-radius: 40px;
      padding: 40px 30px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Título principal */
    .card-title {
      font-size: 1.6rem;
      font-weight: 500;
      margin-bottom: 10px;
      color: #ffffff;
    }

    /* Estilos de botones de enlace */
    .btn-link {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 25px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 1.05rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .btn-link:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    /* Colores personalizados de los botones según diseño */
    .btn-whatsapp {
      background-color: #2e7d32; /* Verde WhatsApp / Corporativo */
    }

    .btn-comercial {
      background-color: #4a3b7d; /* Azul / Morado oscuro */
    }

    .btn-habitacional {
      background-color: #b87322; /* Mostaza / Dorado */
    }

    .btn-contacto {
      background-color: #7f1d1d; /* Rojo / Guinda oscuro */
      line-height: 1.3;
    }

    /* Enlace de sitio web */
    .site-domain {
      background: rgba(255, 255, 255, 0.85);
      color: #333333;
      padding: 8px 24px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* Redes sociales */
    .social-links {
      display: flex;
      gap: 20px;
      margin: 10px 0;
    }

    .social-links a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* Contenedor del logotipo */
    .logo-container {
      margin-top: 10px;
    }

    .logo-container img {
      max-width: 130px;
      height: auto;
    }

    /* Ajuste para pantallas pequeñas (móviles) */
    @media (max-width: 480px) {
      .card-container {
        padding: 30px 20px;
        border-radius: 30px;
      }

      .card-title {
        font-size: 1.4rem;
      }

      .btn-link {
        font-size: 0.95rem;
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>

  <main class="card-container">
    <h1 class="card-title">Aquí comienza tu hogar</h1>

    <!-- Botones principales -->
    <a href="https://wa.me/TU_NUMERO_AQUI" class="btn-link btn-whatsapp" target="_blank" rel="noopener">
      Escríbenos: WhatsApp
    </a>

    <a href="/catalogo-comercial" class="btn-link btn-comercial">
      Catálogo comercial
    </a>

    <a href="/catalogo-habitacional" class="btn-link btn-habitacional">
      Catálogo habitacional
    </a>

    <a href="/contacto" class="btn-link btn-contacto">
      Deja tu contacto,<br>nosotros nos comunicamos
    </a>

    <!-- Dominio -->
    <a href="https://galabienesraices.com" class="site-domain">
      galabienesraices.com
    </a>

    <!-- Enlaces sociales -->
    <div class="social-links">
      <a href="https://instagram.com/TU_USUARIO" target="_blank" rel="noopener">ig</a>
      <a href="https://facebook.com/TU_USUARIO" target="_blank" rel="noopener">fb</a>
    </div>

    <!-- Logo institucional -->
    <div class="logo-container">
      <img src="/assets/images/logo-gala.png" alt="Gala Bienes Raíces">
    </div>
  </main>

</body>
</html>
