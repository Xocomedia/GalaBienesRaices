<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola | Gala Bienes Raíces</title>

  <!-- Importación de la suite completa de Josefin Sans desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Josefin Sans', sans-serif;
      font-optical-sizing: auto;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Sustituye la ruta por el nombre/ubicación exacta de tu imagen dentro de assets */
      background: url('/assets/images/fondo-cdmx.jpg') no-repeat center center fixed;
      background-size: cover;
      padding: 20px;
    }

    .card-container {
      background: rgba(100, 15, 20, 0.75);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 40px;
      padding: 40px 30px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .card-title {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .btn-link {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 25px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 1.05rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .btn-link:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .btn-whatsapp {
      background-color: #2e7d32;
    }

    .btn-comercial {
      background-color: #4a3b7d;
    }

    .btn-habitacional {
      background-color: #b87322;
    }

    .btn-contacto {
      background-color: #7f1d1d;
      line-height: 1.3;
    }

    .site-domain {
      background: rgba(255, 255, 255, 0.9);
      color: #222222;
      padding: 8px 24px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* Redes sociales con íconos SVG */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 5px;
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: transform 0.2s ease;
    }

    .social-icon:hover {
      transform: scale(1.15);
    }

    .social-icon svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .logo-container {
      margin-top: 10px;
    }

    .logo-container img {
      max-width: 130px;
      height: auto;
    }

    @media (max-width: 480px) {
      .card-container {
        padding: 30px 20px;
        border-radius: 30px;
      }

      .card-title {
        font-size: 1.4rem;
      }

      .btn-link {
        font-size: 0.95rem;
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>

  <main class="card-container">
    <h1 class="card-title">Aquí comienza tu hogar</h1>

    <a href="https://wa.me/TU_NUMERO_AQUI" class="btn-link btn-whatsapp" target="_blank" rel="noopener">
      Escríbenos: WhatsApp
    </a>

    <a href="/catalogo-comercial" class="btn-link btn-comercial">
      Catálogo comercial
    </a>

    <a href="/catalogo-habitacional" class="btn-link btn-habitacional">
      Catálogo habitacional
    </a>

    <a href="/contacto" class="btn-link btn-contacto">
      Deja tu contacto,<br>nosotros nos comunicamos
    </a>

    <a href="https://galabienesraices.com" class="site-domain">
      galabienesraices.com
    </a>

    </div>

      <img src="/assets/images/logo-gala.png" alt="Gala Bienes Raíces">
    </div>
  </main>

</html>
